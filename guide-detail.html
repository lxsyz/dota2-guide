<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>攻略详情 - DOTA 2 攻略站</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .guide-article { max-width: 800px; margin: 0 auto; }
    .guide-header { margin-bottom: 30px; }
    .guide-header h1 { font-family: var(--font-heading); font-size: 1.8rem; margin: 12px 0; color: var(--accent-gold); }
    .guide-summary { color: var(--text-secondary); font-size: 1rem; margin-bottom: 12px; }
    .guide-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .guide-meta { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .guide-content { line-height: 1.8; }
    .guide-content h1 { font-family: var(--font-heading); font-size: 1.5rem; color: var(--accent-gold); margin: 28px 0 12px; }
    .guide-content h2 { font-family: var(--font-heading); font-size: 1.3rem; color: var(--accent-gold); margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
    .guide-content h3 { font-size: 1.05rem; color: var(--text-primary); margin: 20px 0 8px; }
    .guide-content p { margin-bottom: 12px; color: var(--text-secondary); }
    .guide-content ul { margin: 8px 0 16px 20px; }
    .guide-content li { margin-bottom: 6px; color: var(--text-secondary); }
    .guide-content strong { color: var(--text-primary); }
    .guide-content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.85rem; }
    .guide-content th, .guide-content td { padding: 8px 12px; border: 1px solid var(--border-color); text-align: left; }
    .guide-content th { background: var(--bg-secondary); color: var(--text-primary); }
    .guide-content td { color: var(--text-secondary); }
    .guide-footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color); }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav-container">
      <a href="index.html" class="site-logo">⚔️ <span>DOTA 2</span> 攻略站</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="heroes.html">英雄</a></li>
        <li><a href="items.html">物品</a></li>
        <li><a href="guides.html" class="active">攻略</a></li>
        <li><a href="meta.html">版本</a></li>
        <li><a href="tools.html">工具</a></li>
      </ul>
      <div class="nav-search">
        <input type="text" placeholder="搜索英雄/物品...">
        <div class="search-results"></div>
      </div>
      <button class="mobile-menu-btn">☰</button>
    </nav>
  </header>

  <main class="main-content">
    <div style="margin-bottom:16px">
      <a href="guides.html" style="font-size:0.9rem">← 返回攻略列表</a>
    </div>
    <div id="guide-detail">
      <p class="loading">加载中</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>DOTA 2 攻略站 - 非官方社区攻略网站 | DOTA 2 是 Valve Corporation 的注册商标</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/guides.js"></script>
</body>
</html>
