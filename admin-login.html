<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - DOTA 2 攻略站</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: var(--bg-secondary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-header .login-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .login-header h1 {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      color: var(--accent-gold);
      margin-bottom: 6px;
    }
    .login-header p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .login-form {
      display: grid;
      gap: 16px;
    }
    .login-field label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .login-field input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: var(--transition);
    }
    .login-field input:focus {
      outline: none;
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(212,168,67,0.15);
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 1rem;
    }
    .login-error {
      background: rgba(220,53,69,0.1);
      border: 1px solid rgba(220,53,69,0.3);
      color: var(--accent-red);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      display: none;
    }
    .login-error.show {
      display: block;
    }
    .login-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }
    .login-footer a {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-decoration: none;
    }
    .login-footer a:hover {
      color: var(--accent-gold);
    }
    .login-hint {
      margin-top: 16px;
      padding: 10px 12px;
      background: rgba(212,168,67,0.08);
      border: 1px dashed rgba(212,168,67,0.3);
      border-radius: var(--radius);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }
    .login-hint code {
      color: var(--accent-gold);
      background: rgba(0,0,0,0.2);
      padding: 1px 6px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">🔐</div>
      <h1>管理员登录</h1>
      <p>DOTA 2 攻略站后台数据中心</p>
    </div>

    <form class="login-form" id="login-form" autocomplete="off">
      <div class="login-field">
        <label for="login-username">用户名</label>
        <input type="text" id="login-username" required autocomplete="off" autofocus>
      </div>
      <div class="login-field">
        <label for="login-password">密码</label>
        <input type="password" id="login-password" required autocomplete="new-password">
      </div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn btn-primary login-btn">登录</button>
    </form>

    <div class="login-hint">
      默认账号 <code>admin</code> / 密码 <code>admin123</code><br>
      首次登录后请立即修改密码
    </div>

    <div class="login-footer">
      <a href="index.html">← 返回首页</a>
    </div>
  </div>

  <script src="js/admin-auth.js"></script>
  <script>
    // 已登录则跳转后台
    if (AdminAuth.isLoggedIn()) {
      window.location.href = 'analytics.html';
    }

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      if (!username || !password) {
        errorEl.textContent = '请输入用户名和密码';
        errorEl.classList.add('show');
        return;
      }

      const btn = form.querySelector('.login-btn');
      btn.disabled = true;
      btn.textContent = '登录中...';

      const result = await AdminAuth.login(username, password);

      if (result.success) {
        window.location.href = 'analytics.html';
      } else {
        errorEl.textContent = result.message;
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = '登录';
        document.getElementById('login-password').value = '';
      }
    });
  </script>
</body>
</html>
